<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SidePad</title>
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=outfit:400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside>
        <div class="aside-drag">
          <p class="brand">SidePad</p>
          <p class="brand-line">Notes that stay with you</p>
        </div>

        <div class="aside-actions">
          <button type="button" id="new-note" class="btn-primary">New note</button>
          <label class="search-field">
            <span class="search-label">Search</span>
            <input id="note-search" type="search" placeholder="Filter notes" autocomplete="off" />
          </label>
        </div>

        <div class="list-wrap">
          <ul id="note-list"></ul>
        </div>

        <label class="startup-toggle">
          <input id="open-at-login" type="checkbox" checked />
          <span>Open on startup</span>
        </label>
      </aside>

      <main>
        <div class="main-drag">
          <button type="button" id="chat-expand" class="chat-expand" hidden>Ask</button>
        </div>

        <section class="pad" id="editor" data-empty="true" aria-label="Note editor">
          <div class="empty" id="empty-state">
            <h1>Your pad is empty</h1>
            <p>Create a note or open one from the list. Writing saves as you go.</p>
            <button type="button" id="empty-new" class="btn-primary">New note</button>
          </div>

          <div class="compose">
            <label class="field">
              <span class="field-label">Title</span>
              <input id="note-title" type="text" placeholder="Give this note a name" />
            </label>
            <div class="field field-body">
              <div class="field-body-head">
                <span class="field-label" id="body-label">Body</span>
                <div class="md-toolbar" id="md-toolbar" role="toolbar" aria-label="Markdown">
                  <button type="button" data-md="bold" title="Bold" aria-label="Bold">B</button>
                  <button type="button" data-md="italic" title="Italic" aria-label="Italic">I</button>
                  <button type="button" data-md="underline" title="Underline" aria-label="Underline">U</button>
                  <button type="button" data-md="bullet" title="Bullet" aria-label="Bullet">•</button>
                </div>
              </div>
              <textarea id="note-body" placeholder="Start writing"></textarea>
              <div id="note-preview" class="note-preview" hidden></div>
            </div>
            <div class="compose-meta">
              <p id="status" class="status">Ready</p>
              <div class="compose-actions">
                <p id="word-count" class="meta-count">0 words</p>
                <button type="button" id="toggle-preview" class="btn-ghost">Preview</button>
                <button type="button" id="delete-note" class="btn-danger">Delete</button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <aside class="chat-aside" id="chat-panel" data-empty="true" aria-label="Note chat">
        <div class="chat-head">
          <div>
            <p class="chat-title">Ask</p>
            <p class="chat-sub">Ask or edit this note</p>
          </div>
          <div class="chat-head-actions">
            <button type="button" id="chat-clear" class="chat-toggle" aria-label="Clear chat">Clear</button>
            <button type="button" id="chat-collapse" class="chat-toggle" aria-label="Hide ask">›</button>
          </div>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-compose">
            <input id="ask-input" type="text" placeholder="Ask or edit this note" autocomplete="off" />
          <button type="button" id="ask-btn" class="btn-primary">Ask</button>
        </div>
      </aside>
    </div>

    <div id="confirm-dialog" class="confirm" hidden>
      <div class="confirm-backdrop" data-confirm="cancel"></div>
      <div
        class="confirm-panel"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
        aria-describedby="confirm-copy"
      >
        <p id="confirm-title" class="confirm-title">Delete note</p>
        <p id="confirm-copy" class="confirm-copy">This cannot be undone.</p>
        <p id="confirm-name" class="confirm-name"></p>
        <div class="confirm-actions">
          <button type="button" id="confirm-cancel" class="btn-ghost">Cancel</button>
          <button type="button" id="confirm-ok" class="btn-danger-solid">Delete</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
